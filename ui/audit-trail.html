<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledgerline — Audit Trail</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--color-primary:#0f62fe;--color-primary-hover:#0353e9;--color-bg:#ffffff;--color-surface:#f4f4f4;--color-surface-hover:#e8e8e8;--color-surface-raised:#ffffff;--color-text-primary:#161616;--color-text-secondary:#525252;--color-text-muted:#8d8d8d;--color-text-inverse:#ffffff;--color-border:#e0e0e0;--color-border-strong:#8d8d8d;--color-success:#198038;--color-success-bg:#defbe6;--color-warning:#b28600;--color-warning-bg:#fdf6dd;--color-error:#da1e28;--color-error-bg:#fff1f1;--color-info:#0043ce;--color-info-bg:#edf5ff;--color-focus:#0f62fe;--font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-mono:'IBM Plex Mono',Consolas,monospace;--font-size-xs:0.75rem;--font-size-sm:0.875rem;--font-size-base:1rem;--font-size-lg:1.125rem;--font-size-xl:1.25rem;--font-size-2xl:1.5rem;--font-weight-regular:400;--font-weight-medium:500;--font-weight-semibold:600;--font-weight-bold:700;--spacing-1:4px;--spacing-2:8px;--spacing-3:12px;--spacing-4:16px;--spacing-6:24px;--spacing-8:32px;--spacing-12:48px;--shadow-sm:0 1px 2px rgba(0,0,0,0.05);--shadow-md:0 2px 6px rgba(0,0,0,0.08);--shadow-lg:0 4px 12px rgba(0,0,0,0.12);--radius-sm:2px;--radius-md:4px;--radius-lg:8px;--radius-full:9999px;--transition-fast:120ms ease;--transition-normal:200ms ease;}
[data-theme="dark"]{--color-primary:#78a9ff;--color-primary-hover:#a6c8ff;--color-bg:#161616;--color-surface:#262626;--color-surface-hover:#353535;--color-surface-raised:#393939;--color-text-primary:#f4f4f4;--color-text-secondary:#c6c6c6;--color-text-muted:#6f6f6f;--color-text-inverse:#161616;--color-border:#393939;--color-border-strong:#6f6f6f;--color-success:#42be65;--color-success-bg:#044317;--color-warning:#f1c21b;--color-warning-bg:#3a2f00;--color-error:#fa4d56;--color-error-bg:#470b0e;--color-info:#4589ff;--color-info-bg:#001d6c;--color-focus:#78a9ff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-family);font-size:var(--font-size-base);color:var(--color-text-primary);background:var(--color-bg);transition:background var(--transition-normal);}
.theme-toggle{position:fixed;top:12px;right:12px;z-index:9999;width:36px;height:36px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface-raised);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow-sm);}
.theme-toggle:hover{background:var(--color-surface-hover);}
.page-container{max-width:1200px;margin:0 auto;padding:var(--spacing-6) var(--spacing-8);}
@media(max-width:768px){.page-container{padding:var(--spacing-4);}}

.breadcrumbs{display:flex;align-items:center;gap:var(--spacing-1);font-size:var(--font-size-sm);color:var(--color-text-muted);margin-bottom:var(--spacing-4);}
.breadcrumbs a{color:var(--color-primary);text-decoration:none;}
.breadcrumbs a:hover{text-decoration:underline;}
.breadcrumbs .sep{margin:0 var(--spacing-1);}

.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--spacing-6);flex-wrap:wrap;gap:var(--spacing-3);}
.page-header h1{font-size:var(--font-size-2xl);font-weight:var(--font-weight-semibold);}
.badge{display:inline-flex;align-items:center;gap:var(--spacing-1);padding:2px 10px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);border-radius:var(--radius-full);}
.badge-info{background:var(--color-info-bg);color:var(--color-info);}

/* Filters */
.filter-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--spacing-3);margin-bottom:var(--spacing-4);padding:var(--spacing-4);background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:var(--radius-md);}
.filter-group{display:flex;flex-direction:column;gap:var(--spacing-1);}
.filter-label{font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-muted);}
.filter-input{padding:var(--spacing-2) var(--spacing-3);font-family:var(--font-family);font-size:var(--font-size-sm);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-bg);color:var(--color-text-primary);min-height:34px;}
.filter-input:focus{outline:none;border-color:var(--color-focus);box-shadow:0 0 0 1px var(--color-focus);}
.filter-actions{display:flex;gap:var(--spacing-2);align-items:flex-end;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-2);padding:var(--spacing-2) var(--spacing-4);font-family:var(--font-family);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);border:2px solid transparent;border-radius:var(--radius-md);cursor:pointer;transition:all var(--transition-fast);min-height:34px;}
.btn:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px;}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse);}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-secondary{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-strong);}
.btn-secondary:hover{background:var(--color-surface-hover);}
.btn-ghost{background:transparent;color:var(--color-primary);border:none;}
.btn-ghost:hover{background:var(--color-info-bg);}

/* Audit entries */
.audit-list{border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;}
.audit-entry{border-bottom:1px solid var(--color-border);}
.audit-entry:last-child{border-bottom:none;}
.audit-entry-header{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;align-items:center;gap:var(--spacing-3);padding:var(--spacing-3) var(--spacing-4);background:var(--color-surface-raised);cursor:pointer;transition:background var(--transition-fast);font-size:var(--font-size-sm);}
@media(max-width:768px){.audit-entry-header{grid-template-columns:1fr 1fr;gap:var(--spacing-2);}}
.audit-entry-header:hover{background:var(--color-surface-hover);}
.audit-entry-header:focus-visible{outline:2px solid var(--color-focus);outline-offset:-2px;}
.audit-label{font-size:var(--font-size-xs);color:var(--color-text-muted);}
.audit-value{font-weight:var(--font-weight-medium);}
.chevron{transition:transform var(--transition-fast);font-size:var(--font-size-xs);color:var(--color-text-muted);}
.audit-entry.open .chevron{transform:rotate(180deg);}
.audit-entry-body{display:none;padding:var(--spacing-4);background:var(--color-surface);font-size:var(--font-size-sm);border-top:1px solid var(--color-border);}
.audit-entry.open .audit-entry-body{display:block;}
.payload-block{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--spacing-3);font-family:var(--font-mono);font-size:var(--font-size-xs);white-space:pre-wrap;overflow-x:auto;max-height:300px;overflow-y:auto;line-height:1.6;}

.tag{display:inline-flex;padding:1px 6px;font-size:var(--font-size-xs);background:var(--color-surface);color:var(--color-text-secondary);border-radius:var(--radius-sm);border:1px solid var(--color-border);}
.badge-success{background:var(--color-success-bg);color:var(--color-success);}
.badge-warning{background:var(--color-warning-bg);color:var(--color-warning);}
.badge-error{background:var(--color-error-bg);color:var(--color-error);}
.badge-neutral{background:var(--color-surface);color:var(--color-text-secondary);}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:var(--spacing-4);font-size:var(--font-size-sm);color:var(--color-text-secondary);flex-wrap:wrap;gap:var(--spacing-2);}
.pagination-btns{display:flex;gap:var(--spacing-1);}
.page-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface-raised);color:var(--color-text-primary);cursor:pointer;font-size:var(--font-size-sm);font-family:var(--font-family);transition:all var(--transition-fast);}
.page-btn:hover{background:var(--color-surface-hover);}
.page-btn.active{background:var(--color-primary);color:var(--color-text-inverse);border-color:var(--color-primary);}
.page-btn[disabled]{opacity:.4;cursor:default;}

/* Empty state */
.empty-state{text-align:center;padding:var(--spacing-12) var(--spacing-8);color:var(--color-text-muted);font-size:var(--font-size-sm);display:none;}
.empty-state.visible{display:block;}

/* Dropdown */
.dropdown{position:relative;display:inline-block;}
.dropdown-menu{position:absolute;top:100%;right:0;margin-top:var(--spacing-1);background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);min-width:160px;z-index:100;display:none;}
.dropdown-menu.open{display:block;}
.dropdown-item{display:block;width:100%;padding:var(--spacing-2) var(--spacing-3);font-size:var(--font-size-sm);color:var(--color-text-primary);background:none;border:none;cursor:pointer;text-align:left;font-family:var(--font-family);}
.dropdown-item:hover{background:var(--color-surface-hover);}

/* --- Live additions: chain integrity + record trace ------------------------ */
.chain-bar{display:flex;align-items:center;gap:var(--spacing-3);flex-wrap:wrap;padding:var(--spacing-3) var(--spacing-4);margin-bottom:var(--spacing-4);border:1px solid var(--color-border);border-left:4px solid var(--color-success);border-radius:var(--radius-md);background:var(--color-surface-raised);font-size:var(--font-size-sm);}
.chain-bar.broken{border-left-color:var(--color-error);}
.chain-bar .hash{font-family:var(--font-mono);font-size:var(--font-size-xs);color:var(--color-text-secondary);word-break:break-all;}
.trace-panel{border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface-raised);padding:var(--spacing-4);margin-bottom:var(--spacing-4);}
.trace-form{display:flex;gap:var(--spacing-2);flex-wrap:wrap;align-items:flex-end;}
.trace-result{display:none;margin-top:var(--spacing-4);}
.trace-result.visible{display:block;}
.trace-chain{display:flex;align-items:stretch;gap:var(--spacing-2);flex-wrap:wrap;margin-bottom:var(--spacing-3);}
.trace-step{flex:1 1 150px;min-width:140px;padding:var(--spacing-3);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);}
.trace-step .k{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-bottom:2px;}
.trace-step .v{font-weight:var(--font-weight-medium);font-size:var(--font-size-sm);word-break:break-word;}
.trace-arrow{display:flex;align-items:center;color:var(--color-text-muted);}
@media(max-width:768px){.trace-arrow{display:none;}}
.err{color:var(--color-error);font-size:var(--font-size-sm);}
.muted{color:var(--color-text-muted);font-size:var(--font-size-xs);}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">☀</button>

<div class="page-container">
  <nav class="breadcrumbs"><a href="/">Dashboard</a><span class="sep">/</span><span>Audit Trail</span></nav>

  <div class="page-header">
    <h1>🔒 Audit Trail</h1>
    <div style="display:flex;gap:var(--spacing-2);align-items:center">
      <label class="muted" style="display:flex;align-items:center;gap:var(--spacing-1)">
        <input type="checkbox" id="liveToggle" checked> live
      </label>
      <div class="dropdown">
        <button class="btn btn-secondary" id="exportBtn">↓ Export</button>
        <div class="dropdown-menu" id="exportMenu">
          <button class="dropdown-item" id="exportJson">Export as JSON</button>
          <button class="dropdown-item" id="exportCsv">Export as CSV</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Chain integrity — recomputed server-side on every read -->
  <div class="chain-bar" id="chainBar">
    <span class="badge badge-neutral" id="chainBadge">checking…</span>
    <span>SHA-256 hash chain</span>
    <span class="hash" id="chainHead"></span>
    <span class="muted" style="margin-left:auto" id="chainNote">append-only · UPDATE and DELETE blocked at the database</span>
  </div>

  <!-- Trace a written record back to its authorising order (criterion 7) -->
  <div class="trace-panel">
    <div class="trace-form">
      <div class="filter-group" style="flex:0 0 160px">
        <span class="filter-label">Trace a record — system</span>
        <select class="filter-input" id="traceSystem"><option value="erp">ERP</option><option value="accounting">Accounting</option><option value="crm">CRM</option></select>
      </div>
      <div class="filter-group" style="flex:1 1 200px">
        <span class="filter-label">Record ID</span>
        <input class="filter-input" id="traceRecord" type="text" placeholder="CUST-4471">
      </div>
      <button class="btn btn-primary" id="traceBtn">Trace</button>
      <button class="btn btn-ghost" id="traceClear">Clear</button>
    </div>
    <div class="trace-result" id="traceResult"></div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Date From</span>
      <input class="filter-input" id="fDateFrom" type="date">
    </div>
    <div class="filter-group">
      <span class="filter-label">Date To</span>
      <input class="filter-input" id="fDateTo" type="date">
    </div>
    <div class="filter-group">
      <span class="filter-label">Event</span>
      <select class="filter-input" id="fEvent"><option value="">All Events</option></select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Work Order</span>
      <input class="filter-input" id="fWorkOrder" type="text" placeholder="WO-…">
    </div>
    <div class="filter-group">
      <span class="filter-label">Actor</span>
      <input class="filter-input" id="fActor" type="text" placeholder="approver@…">
    </div>
    <div class="filter-actions">
      <button class="btn btn-primary" id="searchBtn">Search</button>
      <button class="btn btn-ghost" id="clearBtn">Clear</button>
    </div>
  </div>

  <div style="font-size:var(--font-size-xs);color:var(--color-text-muted);margin-bottom:var(--spacing-3)" id="resultCount">Loading…</div>

  <div class="audit-list" id="auditList"></div>

  <div class="empty-state" id="emptyState">No audit records match your filters.</div>

  <div class="pagination">
    <span id="pageInfo"></span>
    <div class="pagination-btns" id="pageBtns"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var PAGE_SIZE = 25;
  var all = [];      // every entry from the server, newest first
  var shown = [];    // after filters
  var page = 1;
  var timer = null;

  // Event type -> human label and severity, per the Forge design's badge palette.
  var EVENTS = {
    'change.detected':     ['Change Detected',     'badge-info'],
    'work_order.derived':  ['Work Order Created',  'badge-neutral'],
    'work_order.amended':  ['Work Order Amended',  'badge-warning'],
    'work_order.approved': ['Work Order Approved', 'badge-success'],
    'work_order.rejected': ['Work Order Rejected', 'badge-error'],
    'work_order.synced':   ['Write Synced',        'badge-success'],
    'work_order.failed':   ['Execution Failed',    'badge-error'],
    'sandbox.created':     ['Sandbox Created',     'badge-info'],
    'sandbox.destroyed':   ['Sandbox Destroyed',   'badge-neutral'],
    'write.executed':      ['Write Executed',      'badge-success'],
    'write.denied':        ['Write Denied',        'badge-error']
  };

  function esc(s){
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function label(ev){ return (EVENTS[ev] || [ev, 'badge-neutral'])[0]; }
  function tone(ev){ return (EVENTS[ev] || [ev, 'badge-neutral'])[1]; }
  function when(ts){
    var d = new Date(ts);
    if (isNaN(d)) return ts;
    return d.toLocaleString('en-GB', {day:'2-digit', month:'short', year:'numeric',
      hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
  function actorOf(e){
    if (e.actor === 'agent')  return 'System (agent)';
    if (e.actor === 'sandbox') return 'System (sandbox)';
    if (e.actor === 'system')  return 'System';
    if (e.actor === 'crm')     return 'CRM (source)';
    return e.actor;
  }

  // --- rendering ----------------------------------------------------------

  function render(){
    var list = document.getElementById('auditList');
    var empty = document.getElementById('emptyState');
    var pages = Math.max(1, Math.ceil(shown.length / PAGE_SIZE));
    if (page > pages) page = pages;
    var slice = shown.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

    empty.classList.toggle('visible', shown.length === 0);
    list.innerHTML = slice.map(function(e){
      var body = {
        seq: e.seq, event_type: e.event, work_order_id: e.work_order_id,
        actor: e.actor, timestamp: e.ts, detail: e.detail,
        hash: e.hash, prev_hash: e.prev_hash
      };
      return '<div class="audit-entry">' +
        '<div class="audit-entry-header" tabindex="0" role="button" aria-expanded="false">' +
          '<div><div class="audit-label">Event</div><div class="audit-value">' +
            '<span class="badge ' + tone(e.event) + '">' + esc(label(e.event)) + '</span></div></div>' +
          '<div><div class="audit-label">Work Order</div><div class="audit-value" style="font-family:var(--font-mono)">' +
            esc(e.work_order_id || '—') + '</div></div>' +
          '<div><div class="audit-label">Actor</div><div class="audit-value">' + esc(actorOf(e)) + '</div></div>' +
          '<div><div class="audit-label">Timestamp</div><div class="audit-value">' + esc(when(e.ts)) + '</div></div>' +
          '<span class="chevron">▼</span>' +
        '</div>' +
        '<div class="audit-entry-body"><div class="payload-block">' +
          esc(JSON.stringify(body, null, 2)) + '</div></div>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(list.querySelectorAll('.audit-entry-header'), function(h){
      function toggle(){
        var open = h.parentElement.classList.toggle('open');
        h.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      h.addEventListener('click', toggle);
      h.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
      });
    });

    document.getElementById('resultCount').textContent =
      'Showing ' + slice.length + ' of ' + shown.length + ' records' +
      (shown.length !== all.length ? ' (filtered from ' + all.length + ')' : '');
    document.getElementById('pageInfo').textContent =
      'Page ' + page + ' of ' + pages + ' · ' + shown.length + ' total records';

    var btns = ['<button class="page-btn" data-p="' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + '>‹</button>'];
    for (var i = 1; i <= pages; i++) {
      btns.push('<button class="page-btn' + (i === page ? ' active' : '') + '" data-p="' + i + '">' + i + '</button>');
    }
    btns.push('<button class="page-btn" data-p="' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + '>›</button>');
    var pb = document.getElementById('pageBtns');
    pb.innerHTML = btns.join('');
    Array.prototype.forEach.call(pb.querySelectorAll('.page-btn'), function(b){
      b.addEventListener('click', function(){
        if (b.disabled) return;
        page = parseInt(b.getAttribute('data-p'), 10);
        render();
      });
    });
  }

  function applyFilters(){
    var ev = document.getElementById('fEvent').value;
    var wo = document.getElementById('fWorkOrder').value.trim().toLowerCase();
    var ac = document.getElementById('fActor').value.trim().toLowerCase();
    var from = document.getElementById('fDateFrom').value;
    var to = document.getElementById('fDateTo').value;

    shown = all.filter(function(e){
      if (ev && e.event !== ev) return false;
      if (wo && String(e.work_order_id || '').toLowerCase().indexOf(wo) === -1) return false;
      if (ac && String(e.actor || '').toLowerCase().indexOf(ac) === -1) return false;
      var day = String(e.ts).slice(0, 10);
      if (from && day < from) return false;
      if (to && day > to) return false;
      return true;
    });
    render();
  }

  // --- data ---------------------------------------------------------------

  function load(){
    return fetch('/api/v1/audit?limit=1000')
      .then(function(r){ return r.json(); })
      .then(function(data){
        all = data.entries || [];

        var bar = document.getElementById('chainBar');
        var badge = document.getElementById('chainBadge');
        var intact = data.chain && data.chain.intact;
        bar.classList.toggle('broken', !intact);
        badge.className = 'badge ' + (intact ? 'badge-success' : 'badge-error');
        badge.textContent = intact ? '✓ verified' : '✗ broken';
        document.getElementById('chainHead').textContent = intact
          ? 'head ' + (data.chain.head || '')
          : 'chain breaks at entry ' + (data.chain && data.chain.broken_at_seq);
        document.getElementById('chainNote').textContent = intact
          ? all.length + ' entries recomputed server-side on this read'
          : 'tamper detected — investigate before trusting any write';

        // Populate the event filter from what actually exists.
        var sel = document.getElementById('fEvent');
        var have = {};
        all.forEach(function(e){ have[e.event] = true; });
        var keep = sel.value;
        sel.innerHTML = '<option value="">All Events</option>' +
          Object.keys(have).sort().map(function(k){
            return '<option value="' + esc(k) + '">' + esc(label(k)) + '</option>';
          }).join('');
        sel.value = keep;

        applyFilters();
      })
      .catch(function(err){
        document.getElementById('resultCount').innerHTML =
          '<span class="err">Cannot reach the API: ' + esc(err.message) +
          '. Is the server running? <code>bash scripts/restart.sh</code></span>';
      });
  }

  // --- trace (criterion 7) ------------------------------------------------

  function step(k, v){
    return '<div class="trace-step"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>';
  }

  function trace(){
    var sys = document.getElementById('traceSystem').value;
    var rec = document.getElementById('traceRecord').value.trim();
    var out = document.getElementById('traceResult');
    if (!rec) { out.className = 'trace-result visible'; out.innerHTML = '<span class="err">Enter a record ID.</span>'; return; }

    fetch('/api/v1/audit/trace/' + encodeURIComponent(sys) + '/' + encodeURIComponent(rec))
      .then(function(r){ return r.json().then(function(b){ return {ok: r.ok, body: b}; }); })
      .then(function(res){
        out.className = 'trace-result visible';
        if (!res.ok) {
          out.innerHTML = '<span class="err">' + esc(res.body.detail || 'not found') + '</span>';
          return;
        }
        var b = res.body;
        var order = (b.authorised_by || [])[0];
        if (!order) {
          out.innerHTML = '<span class="err">This record exists but no work order authorised it — that is a governance defect, not a display bug.</span>';
          return;
        }
        var arrow = '<div class="trace-arrow">→</div>';
        var html = '<div class="trace-chain">' +
          step('Record in ' + sys.toUpperCase(), b.record.record_id) + arrow +
          step('Authorising order', order.id) + arrow +
          step('Approved by', order.decided_by || '—') + arrow +
          step('At', when(order.decided_at)) + arrow +
          step('Code executed', 'sandbox ' + (order.sandbox_id || '—')) +
        '</div>';

        html += '<div class="muted" style="margin-bottom:var(--spacing-2)">Originating change · ' +
          esc(order.source_system.toUpperCase()) + ' → ' + esc(order.target_system.toUpperCase()) +
          ' · ' + (b.audit || []).length + ' linked audit entries</div>';

        html += '<div class="payload-block">' + esc(
          (b.audit || []).map(function(e){
            return String(e.seq).padStart(4, '0') + '  ' + e.ts + '  ' +
                   label(e.event).padEnd(22) + '  ' + e.actor + '  ' + e.hash.slice(0, 16) + '…';
          }).join('\n')) + '</div>';

        html += '<div class="muted" style="margin-top:var(--spacing-3)">Code that ran</div>' +
          '<div class="payload-block">' + esc(order.code || '') + '</div>';

        out.innerHTML = html;
      })
      .catch(function(err){
        out.className = 'trace-result visible';
        out.innerHTML = '<span class="err">' + esc(err.message) + '</span>';
      });
  }

  // --- export -------------------------------------------------------------

  function download(name, text, mime){
    var blob = new Blob([text], {type: mime});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }

  function toCsv(rows){
    var cols = ['seq','ts','event','work_order_id','actor','prev_hash','hash','detail'];
    var lines = [cols.join(',')];
    rows.forEach(function(e){
      lines.push(cols.map(function(c){
        var v = c === 'detail' ? JSON.stringify(e.detail) : e[c];
        return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
      }).join(','));
    });
    return lines.join('\n');
  }

  // --- wiring -------------------------------------------------------------

  var isDark = false;
  document.getElementById('themeToggle').addEventListener('click', function(){
    isDark = !isDark;
    if (isDark) { document.documentElement.setAttribute('data-theme','dark'); this.textContent = '🌙'; }
    else { document.documentElement.removeAttribute('data-theme'); this.textContent = '☀'; }
  });

  var exportBtn = document.getElementById('exportBtn');
  var exportMenu = document.getElementById('exportMenu');
  exportBtn.addEventListener('click', function(e){ e.stopPropagation(); exportMenu.classList.toggle('open'); });
  document.addEventListener('click', function(){ exportMenu.classList.remove('open'); });
  document.getElementById('exportJson').addEventListener('click', function(){
    download('ledgerline-audit.json', JSON.stringify(shown, null, 2), 'application/json');
    exportMenu.classList.remove('open');
  });
  document.getElementById('exportCsv').addEventListener('click', function(){
    download('ledgerline-audit.csv', toCsv(shown), 'text/csv');
    exportMenu.classList.remove('open');
  });

  document.getElementById('searchBtn').addEventListener('click', applyFilters);
  document.getElementById('clearBtn').addEventListener('click', function(){
    ['fWorkOrder','fActor','fDateFrom','fDateTo'].forEach(function(id){ document.getElementById(id).value = ''; });
    document.getElementById('fEvent').selectedIndex = 0;
    page = 1;
    applyFilters();
  });
  ['fWorkOrder','fActor'].forEach(function(id){
    document.getElementById(id).addEventListener('keyup', function(e){ if (e.key === 'Enter') applyFilters(); });
  });
  document.getElementById('fEvent').addEventListener('change', function(){ page = 1; applyFilters(); });

  document.getElementById('traceBtn').addEventListener('click', trace);
  document.getElementById('traceRecord').addEventListener('keyup', function(e){ if (e.key === 'Enter') trace(); });
  document.getElementById('traceClear').addEventListener('click', function(){
    document.getElementById('traceRecord').value = '';
    document.getElementById('traceResult').className = 'trace-result';
  });

  function setLive(on){
    if (timer) { clearInterval(timer); timer = null; }
    if (on) timer = setInterval(load, 4000);
  }
  document.getElementById('liveToggle').addEventListener('change', function(){ setLive(this.checked); });

  load();
  setLive(true);
})();
</script>
</body>
</html>
