<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledgerline — Session Timeout</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--color-primary:#0f62fe;--color-primary-hover:#0353e9;--color-bg:#ffffff;--color-surface:#f4f4f4;--color-surface-raised:#ffffff;--color-text-primary:#161616;--color-text-secondary:#525252;--color-text-muted:#8d8d8d;--color-text-inverse:#ffffff;--color-border:#e0e0e0;--color-warning:#b28600;--color-warning-bg:#fdf6dd;--color-focus:#0f62fe;--font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-size-xs:0.75rem;--font-size-sm:0.875rem;--font-size-base:1rem;--font-size-lg:1.125rem;--font-size-xl:1.25rem;--font-size-2xl:1.5rem;--font-size-3xl:2rem;--font-weight-regular:400;--font-weight-medium:500;--font-weight-semibold:600;--font-weight-bold:700;--spacing-2:8px;--spacing-3:12px;--spacing-4:16px;--spacing-6:24px;--spacing-8:32px;--shadow-xl:0 8px 24px rgba(0,0,0,0.16);--radius-md:4px;--radius-lg:8px;--radius-full:9999px;--transition-fast:120ms ease;}
[data-theme="dark"]{--color-primary:#78a9ff;--color-primary-hover:#a6c8ff;--color-bg:#161616;--color-surface:#262626;--color-surface-raised:#393939;--color-text-primary:#f4f4f4;--color-text-secondary:#c6c6c6;--color-text-muted:#6f6f6f;--color-text-inverse:#161616;--color-border:#393939;--color-warning:#f1c21b;--color-warning-bg:#3a2f00;--color-focus:#78a9ff;--shadow-xl:0 8px 24px rgba(0,0,0,0.6);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-family);font-size:var(--font-size-base);color:var(--color-text-primary);background:var(--color-bg);min-height:100vh;}
.theme-toggle{position:fixed;top:12px;right:12px;z-index:9999;width:36px;height:36px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface-raised);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;}

/* Simulated background page */
.bg-page{padding:var(--spacing-8);filter:blur(2px);opacity:0.5;}
.bg-page h1{font-size:var(--font-size-2xl);margin-bottom:var(--spacing-4);}
.bg-placeholder{height:200px;background:var(--color-surface);border-radius:var(--radius-md);margin-bottom:var(--spacing-4);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:var(--color-surface-raised);border-radius:var(--radius-lg);padding:var(--spacing-6);max-width:420px;width:90%;box-shadow:var(--shadow-xl);text-align:center;}
.modal-icon{font-size:var(--font-size-3xl);margin-bottom:var(--spacing-3);}
.modal-title{font-size:var(--font-size-xl);font-weight:var(--font-weight-semibold);margin-bottom:var(--spacing-2);}
.modal-body{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:var(--spacing-6);}
.countdown{font-size:var(--font-size-3xl);font-weight:var(--font-weight-bold);color:var(--color-warning);margin:var(--spacing-4) 0;font-variant-numeric:tabular-nums;}
.modal-actions{display:flex;gap:var(--spacing-3);justify-content:center;}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:var(--spacing-2) var(--spacing-6);font-family:var(--font-family);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);border:2px solid transparent;border-radius:var(--radius-md);cursor:pointer;min-height:40px;transition:all var(--transition-fast);}
.btn:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px;}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse);}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-secondary{background:transparent;color:var(--color-text-primary);border-color:var(--color-border);}
.btn-secondary:hover{background:var(--color-surface);}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">☀</button>

<div class="bg-page">
  <h1>Dashboard</h1>
  <div class="bg-placeholder"></div>
  <div class="bg-placeholder"></div>
</div>

<div class="modal-overlay" id="sessionModal">
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="sessionTitle">
    <div class="modal-icon">⏳</div>
    <div class="modal-title" id="sessionTitle">Session Expiring Soon</div>
    <div class="modal-body">Your session will expire due to inactivity. Any unsaved changes may be lost.</div>
    <div class="countdown" id="countdown" aria-live="assertive">4:59</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="logoutBtn">Log Out</button>
      <button class="btn btn-primary" id="extendBtn">Extend Session</button>
    </div>
  </div>
</div>

<script>
(function(){
  var isDark=false;
  document.getElementById('themeToggle').addEventListener('click',function(){
    isDark=!isDark;
    if(isDark){document.documentElement.setAttribute('data-theme','dark');this.textContent='🌙';}
    else{document.documentElement.removeAttribute('data-theme');this.textContent='☀';}
  });

  // Countdown
  var totalSeconds=299;
  var countdownEl=document.getElementById('countdown');
  function updateCountdown(){
    var m=Math.floor(totalSeconds/60);
    var s=totalSeconds%60;
    countdownEl.textContent=m+':'+(s<10?'0':'')+s;
    if(totalSeconds<=0){
      countdownEl.textContent='0:00';
      alert('Session expired. Redirecting to login…');
      return;
    }
    totalSeconds--;
    setTimeout(updateCountdown,1000);
  }
  updateCountdown();

  document.getElementById('extendBtn').addEventListener('click',function(){
    document.getElementById('sessionModal').style.display='none';
    document.querySelector('.bg-page').style.filter='none';
    document.querySelector('.bg-page').style.opacity='1';
    alert('Session extended for 30 minutes.');
  });

  document.getElementById('logoutBtn').addEventListener('click',function(){
    alert('Logging out… Redirecting to login page.');
  });
})();
</script>
</body>
</html>
