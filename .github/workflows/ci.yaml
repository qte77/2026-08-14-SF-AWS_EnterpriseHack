name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv
          uv pip install -e . ruff

      - name: Lint
        run: uv run ruff check src scripts

      - name: Governance invariants (no Daytona credentials needed)
        run: uv run python scripts/test_governance.py

      # The full end-to-end run (scripts/e2e.py) needs a live Daytona sandbox and
      # therefore a DAYTONA_API_KEY. It is run locally before every merge; it is
      # not run here because the key is not available to forked PRs.
