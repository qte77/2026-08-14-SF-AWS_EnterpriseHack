[project]
name = "ledgerline"
version = "0.1.0"
description = "Governed cross-system sync agent — no write without an authorised work order"
requires-python = ">=3.12"
dependencies = [
    "daytona>=0.204.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# `uv pip install -e '.[dev]'` — ui_e2e.py needs a browser; ruff is the CI gate.
dev = [
    "patchright>=1.47",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerline"]

[tool.ruff]
line-length = 100
